[workspace]
members = [
    "crates/atlas-common",
    "crates/atlas-core",
    "crates/atlas-state",
    "crates/atlas-index",
    "crates/atlas-fs",
    "crates/atlas-server",
    "crates/sources/atlas-source-opencloud",
    "crates/sources/atlas-source-immich",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
atlas-common = { path = "crates/atlas-common" }
atlas-core = { path = "crates/atlas-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# No `panic = "abort"`: text extraction (pdf-extract) is guarded with
# catch_unwind, and the Tauri shell that joins later relies on unwinding too.
