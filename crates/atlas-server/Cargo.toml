[package]
name = "atlas-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-common.workspace = true
atlas-state = { path = "../atlas-state" }
atlas-core.workspace = true
atlas-index = { path = "../atlas-index" }
atlas-fs = { path = "../atlas-fs" }
atlas-source-opencloud = { path = "../sources/atlas-source-opencloud" }
atlas-source-immich = { path = "../sources/atlas-source-immich" }
atlas-source-solstice = { path = "../sources/atlas-source-solstice" }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

axum = "0.8"
# Trimmed from `full`: a runtime, a listener, timers, channels and signals.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "fs"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
toml = "1"
# Debug builds read a local `.env` (see .env.example); release builds never do.
dotenvy = "0.15"

# OIDC: discovery, JWKS and the token exchange over HTTPS, then JWT checks.
# rustls with bundled roots, so the distroless image needs no CA store; the
# same choices as Cosmos.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
