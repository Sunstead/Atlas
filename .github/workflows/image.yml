name: Image

# Builds atlas (with the bundled web app) and publishes it to GHCR.
#   main     -> :latest, :main, :sha-<short>
#   v1.2.3   -> :1.2.3, :1.2, :sha-<short>
# Pull requests build without pushing. Mirrors Cosmos's agent-image.yml.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atlas" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=atlas
            org.opencontainers.image.description=Sunstead Atlas: search across your self-hosted data

      # Build once into the local daemon so the image is checked before
      # anything is published. The push below reuses the same cache.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atlas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          # Under pipefail, `cmd | grep -q` fails at random: grep exits on the
          # first match and cmd dies writing the rest (SIGPIPE, 141). Piped
          # checks read everything with `grep ... >/dev/null` instead.
          # State and index mount points must be owned by uid 1000, or fresh
          # named volumes come up root-owned and unwritable.
          cid=$(docker create atlas:test)
          docker export "$cid" | tar -tvf - | grep -E ' (state|index)/?$' | tee /dev/stderr | grep -c '1000/1000' | grep -q 2
          docker rm "$cid" >/dev/null

          docker run -d --name smoke -p 8080:8080 atlas:test
          for i in $(seq 30); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 1; done

          # No sign-in configured: pages go to sign-in, which says so, and
          # the API refuses. The search survives the redirect.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' 'localhost:8080/search?q=anything')" = \
            'http://localhost:8080/auth/login?return_to=%2Fsearch%3Fq%3Danything'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/auth/login)" = 501
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/me)" = 401
          curl -fsS localhost:8080/favicon.svg | grep '<svg' >/dev/null
          curl -fsS localhost:8080/v1/info | grep '"api_version":1' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/nope)" = 404

          # Dev sign-in, to see the app shell and a database on the volume.
          docker run -d --name dev -p 8081:8080 -e ATLAS_DEV_USER=smoke -v smoke_state:/state atlas:test
          for i in $(seq 30); do curl -fsS localhost:8081/healthz >/dev/null && break; sleep 1; done
          curl -fsS -c jar -o /dev/null localhost:8081/auth/login
          curl -fsS -b jar 'localhost:8081/search?q=anything' | grep 'id="root"' >/dev/null
          curl -fsS -b jar localhost:8081/v1/me | grep '"username":"smoke"' >/dev/null
          docker logs dev 2>&1 | grep 'state database migrated' >/dev/null

          docker logs smoke 2>&1 | tee atlas.log
          grep -q 'serving web app' atlas.log
          if grep -q $'\x1b' atlas.log; then echo 'ANSI escapes in docker logs' >&2; exit 1; fi

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
